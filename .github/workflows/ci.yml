name: go-version workflow

on:
  pull_request:
    branches: [main]

jobs:
  style:
    name: Style Code
    runs-on: ubuntu-latest

    steps:
      - name: Formatting Check
        run: npm run format:check

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      
      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test --coverage

#      - name: Check Go Version
#        run: go version

#      - name: Force Failure
#        run: (exit 1)

