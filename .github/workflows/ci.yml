name: go-version workflow

on:
  pull_request:
    branches: [main]

jobs:
  # This is your separate style job
  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Formatting Check
        run: npm run format:check

  # Your existing tests job
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0" # Fixed from 1.26.0
      
      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test --coverage

